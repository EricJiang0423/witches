# witches 配置：~/.witches/config.toml
# 改完立即生效，不用重启服务；新加的模型要新开 Codex 线程（或重启 app-server）才会出现在模型列表里。
port = 10777
# switch_note = false     # 关掉"✓ 已切换到 xxx"这行提示（默认开）

# 纯文本模型收到图片时，先交给这个模型转写成文字（低推理强度；按图片哈希缓存在 ~/.witches/vision/）。
# 可以写成列表，依次回退。不配则纯文本模型不收图。
# vision = ["gateway/kimi-k3", "gateway/glm-5.3-flash", "mimo/mimo-v2.6-pro"]

# GPT 通道独立于 providers 的并发/重试设置。每台 witches 进程单独计数。
[openai]
max_concurrency = 3       # 0 表示不限制；改完对新请求生效
queue_timeout = 30        # 秒；超时返回 witches_queue_timeout + Retry-After
max_retries = 2           # 首次输出事件前最多额外重试 2 次；0 可关闭
retry_window = 60         # 秒；仅在此窗口内安排重试，不是单次模型生成的超时

# 子代理/审查改用第三方模型。key 是 Codex 请求头 x-openai-subagent 的值：
#   collab_spawn = spawn_agent 子代理   guardian = 自动审批审查   review = /review   memory_consolidation = 记忆整理
# 只改派原本发给 GPT 的请求；子代理自己选了 witches 模型的不动。
[route]
# collab_spawn = "gateway/glm-5.3"
# guardian = "gateway/kimi-k3"

# provider 名字就是模型前缀：下面的模型在 Codex 里叫 gateway/glm-5.3、gateway/kimi-k3
[providers.gateway]
base_url = "https://your-gateway.example.com/v1"
api_key = "sk-..."
wire = "chat"             # chat（默认，witches 做 Responses<->Chat 翻译）| responses（上游原生支持 Responses）
max_concurrency = 6       # 可选：同时打到这个上游的请求数，多出来的排队（防子代理并发触发 429）
# prompt_cache_key = true  # 可选：把 Codex 的 prompt_cache_key 转给上游（Kimi 等支持）
# headers = { "User-Agent" = "..." }

[providers.gateway.models]
# 模型选项：
#   name 显示名 | context 上下文长度 | images 能否直接收图
#   efforts 推理档位，一般不用写：glm-5 / kimi-k3 / deepseek-v4 / mimo-v2 会按官方文档自动套用（见 witches.py 的 PRESETS）。
#           要写的话可以是列表 ["low", "high"]，也可以是表 { low = "low", medium = "high" }（Codex 档位 -> 上游取值，
#           取值写成表就合并进请求体，比如 { none = { thinking = { type = "disabled" } } }）。每个模型都会自动加上 Codex 的 ultra。
#   wire 覆盖 provider 的 wire | upstream 上游真实模型名 | extra 合并进请求体的字段
#   fallback 429/5xx/连不上时依次改用的模型 | hidden = true 不在 Codex 选择器里显示（只给 vision/fallback 用）
"glm-5.3" = { context = 200000, fallback = ["mimo/mimo-v2.6-pro"] }
# 仅在你的上游已验证支持直接收图时配置 images = true；不同网关的同名模型能力可能不同。
"glm-5.3-flash" = { context = 128000, images = true }
"kimi-k3" = { context = 262144, images = true }
"gpt-6.1-sol" = { context = 272000, images = true, wire = "responses" }

[providers.mimo]
base_url = "https://token-plan-cn.xiaomimimo.com/v1"
api_key = "tp-..."

[providers.mimo.models]
"mimo-v2.6-pro" = { context = 1048576, images = true, hidden = true }   # 只用来看图和兜底
